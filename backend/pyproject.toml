[project]
name = "helpdesk"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.2",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "mypy>=2.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
