[project]
name = "helpdesk"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.143.2",
    "mcp==2.3.0",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "coverage>=7.17.0",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.black]
line-length = 120

[tool.coverage.run]
source = ["app"]
branch = false

[tool.coverage.report]
fail_under = 80
show_missing = true
precision = 2
