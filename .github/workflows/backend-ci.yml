name: Backend CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Ruff linting
        working-directory: backend
        run: uv run ruff check .

      - name: Black formatting check
        working-directory: backend
        run: uv run black --check .

      - name: Mypy type checking
        working-directory: backend
        run: uv run mypy app tests

      - name: Pytest automated tests with coverage
        working-directory: backend
        run: uv run python -m coverage run -m pytest -v

      - name: Enforce application coverage gate
        working-directory: backend
        run: uv run python -m coverage report

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  container-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --tag helpdesk-api:ci backend

      - name: Build frontend image
        run: docker build --tag helpdesk-frontend:ci frontend

  publish-images:
    # Publication is independent of deployment so it can be tested first.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && vars.HELPDESK_PUBLISH_ENABLED == 'true'
    needs: [container-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and publish commit-tagged images
        shell: pwsh
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = 'ghcr.io/' + $env:GITHUB_REPOSITORY.ToLowerInvariant()
          $apiImage = "${prefix}-api:$env:GITHUB_SHA"
          $frontendImage = "${prefix}-frontend:$env:GITHUB_SHA"
          $source = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          $env:REGISTRY_TOKEN | docker login ghcr.io --username $env:GITHUB_ACTOR --password-stdin
          if ($LASTEXITCODE -ne 0) { throw 'Registry login failed.' }
          docker build --label "org.opencontainers.image.source=$source" --tag $apiImage backend
          if ($LASTEXITCODE -ne 0) { throw 'API image build failed.' }
          docker build --label "org.opencontainers.image.source=$source" --tag $frontendImage frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend image build failed.' }
          docker push $apiImage
          if ($LASTEXITCODE -ne 0) { throw 'API image push failed.' }
          docker push $frontendImage
          if ($LASTEXITCODE -ne 0) { throw 'Frontend image push failed.' }

  deploy-azure-demo:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && vars.HELPDESK_CD_ENABLED == 'true'
    needs: [publish-images]
    runs-on: [self-hosted, linux, x64, helpdesk-azure-demo]
    permissions:
      contents: read
      packages: read
    concurrency:
      group: helpdesk-azure-demo
      cancel-in-progress: false
    steps:
      - name: Checkout trusted master revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Update the existing private demo
        shell: pwsh
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELPDESK_DEPLOY_DIR: ${{ vars.HELPDESK_DEPLOY_DIR }}
          HELPDESK_COMPOSE_BIN: ${{ vars.HELPDESK_COMPOSE_BIN }}
        run: ./deploy/update-azure-demo.ps1
