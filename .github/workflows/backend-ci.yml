name: Backend CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Ruff linting
        working-directory: backend
        run: uv run ruff check .

      - name: Black formatting check
        working-directory: backend
        run: uv run black --check .

      - name: Mypy type checking
        working-directory: backend
        run: uv run mypy app tests

      - name: Pytest automated tests with coverage
        working-directory: backend
        run: uv run python -m coverage run -m pytest -v

      - name: Enforce application coverage gate
        working-directory: backend
        run: uv run python -m coverage report

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  container-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --tag helpdesk-api:ci backend

      - name: Build frontend image
        run: docker build --tag helpdesk-frontend:ci frontend
