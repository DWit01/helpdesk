# Private synthetic-data learning demo. Not a production deployment.
x-backend-image: &backend-image
  image: localhost/helpdesk-api:azure-demo
  build:
    context: ./backend

services:
  storage-init:
    <<: *backend-image
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    # Change only the roots of this Compose project's named volumes.
    command: ["chown 65532:65532 /helpdesk-data && chown 1000 /keycloak-data"]
    volumes:
      - helpdesk-data:/helpdesk-data
      - keycloak-data:/keycloak-data

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--hostname=http://127.0.0.1:18182"]
    environment:
      KC_DB: dev-file
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Set a temporary demo admin username}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set a temporary demo admin password}
    depends_on:
      storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:18182:8080"
      - "127.0.0.1:18183:8000"
      - "127.0.0.1:18184:8001"
    volumes:
      - keycloak-data:/opt/keycloak/data

  migrate:
    <<: *backend-image
    profiles: ["setup"]
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: sqlite:////data/helpdesk.sqlite3
    depends_on:
      storage-init:
        condition: service_completed_successfully
    volumes:
      - helpdesk-data:/data

  api:
    <<: *backend-image
    network_mode: "service:keycloak"
    environment:
      APP_ENV: local
      DATABASE_URL: sqlite:////data/helpdesk.sqlite3
      KEYCLOAK_ISSUER: http://127.0.0.1:18182/realms/helpdesk
      KEYCLOAK_JWKS_URL: http://127.0.0.1:8080/realms/helpdesk/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: helpdesk-api
      CORS_ALLOWED_ORIGINS: '["http://127.0.0.1:18181"]'
    depends_on:
      keycloak:
        condition: service_started
      storage-init:
        condition: service_completed_successfully
    volumes:
      - helpdesk-data:/data

  frontend:
    image: localhost/helpdesk-frontend:azure-demo
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:18181:8080"
    volumes:
      - ./deploy/frontend-config.js:/usr/share/nginx/html/config.js:ro
    depends_on:
      api:
        condition: service_started

  mcp:
    <<: *backend-image
    profiles: ["mcp"]
    network_mode: "service:keycloak"
    command: ["uvicorn", "app.mcp.server:create_mcp_app", "--factory", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      DATABASE_URL: sqlite:////data/helpdesk.sqlite3
      KEYCLOAK_ISSUER: http://127.0.0.1:18182/realms/helpdesk
      KEYCLOAK_JWKS_URL: http://127.0.0.1:8080/realms/helpdesk/protocol/openid-connect/certs
      MCP_RESOURCE_URL: http://127.0.0.1:18184/mcp
    depends_on:
      keycloak:
        condition: service_started
      storage-init:
        condition: service_completed_successfully
    volumes:
      - helpdesk-data:/data

volumes:
  helpdesk-data:
  keycloak-data:
